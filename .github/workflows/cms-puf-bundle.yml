name: Temporary CMS Marketplace PUF Artifact Bridge

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bridge:
    if: startsWith(github.head_ref, 'automation/cms-puf-bundle-')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Download and verify archive parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/parts

          download_part() {
            local url="$1"
            local destination="$2"
            for attempt in $(seq 1 10); do
              rm -f "$destination"
              if curl -fL \
                --connect-timeout 30 \
                --max-time 1800 \
                --retry 3 \
                --retry-all-errors \
                --retry-delay 2 \
                --output "$destination" \
                "$url"; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            return 1
          }

          download_part \
            "https://agencies-toxic-ensure-oils.trycloudflare.com/cec0bac1aa17bb83d580b7d6988aae22d8eeefa1/cms_marketplace_public_use_files_2014_2026.zip.part001.pdf" \
            "output/parts/part001"
          download_part \
            "https://agencies-toxic-ensure-oils.trycloudflare.com/cec0bac1aa17bb83d580b7d6988aae22d8eeefa1/cms_marketplace_public_use_files_2014_2026.zip.part002.pdf" \
            "output/parts/part002"
          download_part \
            "https://agencies-toxic-ensure-oils.trycloudflare.com/cec0bac1aa17bb83d580b7d6988aae22d8eeefa1/cms_marketplace_public_use_files_2014_2026.zip.part003.pdf" \
            "output/parts/part003"
          download_part \
            "https://agencies-toxic-ensure-oils.trycloudflare.com/cec0bac1aa17bb83d580b7d6988aae22d8eeefa1/cms_marketplace_public_use_files_2014_2026.zip.part004.pdf" \
            "output/parts/part004"
          download_part \
            "https://agencies-toxic-ensure-oils.trycloudflare.com/cec0bac1aa17bb83d580b7d6988aae22d8eeefa1/cms_marketplace_public_use_files_2014_2026.zip.part005.pdf" \
            "output/parts/part005"

          cat > output/parts/SHA256SUMS <<'EOF'
          81d234add97d1057ced60097b307dd106cb88bc896b8db85c2d8ec54d693b7ce  part001
          14a5ecede0e9ddcc8e45558c132ab073a73ee4db77e950fcbeccb8c6320d7f43  part002
          31baad33e60b536ef2e35892a7f684be520006c9ccb8a9bfd3169acd3b11a1c0  part003
          fa07f33c819f56fbd3c753d46c5fb706f77b8b78c817dde387a8c92cfef9d506  part004
          1527121b7ebab072edef0a6041be788f9cb8ca26cec2a6ff21b9e2323936a52f  part005
          EOF
          (cd output/parts && sha256sum --check SHA256SUMS)

          cat output/parts/part001 \
              output/parts/part002 \
              output/parts/part003 \
              output/parts/part004 \
              output/parts/part005 \
              > output/cms_marketplace_public_use_files_2014_2026.zip

          echo "6fbd701838972410e7d7dc1b7c5f73797d6a795f8511e114ae0f6e24488ffad1  output/cms_marketplace_public_use_files_2014_2026.zip" \
            | sha256sum --check

          test "$(stat -c '%s' output/cms_marketplace_public_use_files_2014_2026.zip)" = "572694037"

          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          archive = Path("output/cms_marketplace_public_use_files_2014_2026.zip")
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise SystemExit(f"Corrupt member: {bad}")
              manifest = json.loads(zf.read("metadata/manifest.json"))
              if not isinstance(manifest, list):
                  raise SystemExit("Unexpected manifest structure")
              if len(manifest) != 145:
                  raise SystemExit(f"Expected 145 source files, found {len(manifest)}")
          print("ZIP structure and 145-file manifest verified")
          PY

      - name: Upload complete CMS bundle
        uses: actions/upload-artifact@v4
        with:
          name: cms-marketplace-public-use-files-2014-2026
          path: output/cms_marketplace_public_use_files_2014_2026.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Signal source transfer completion
        if: success()
        shell: bash
        run: |
          curl -fsS --retry 5 --retry-all-errors \
            "https://agencies-toxic-ensure-oils.trycloudflare.com/complete/cec0bac1aa17bb83d580b7d6988aae22d8eeefa1"
